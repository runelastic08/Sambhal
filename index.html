<title>Sambhal – Device Store &amp; Asset Management</title>
<style>
:root{color-scheme:light dark;--bg:#f2f3fb;--card:#fff;--tx:#161a3b;--mut:#6a6f94;--bd:#e3e5f3;--pri:#1f6fe5;--pri2:#14b8a6;--ok:#0b9150;--okb:#dcf5e7;--wr:#c26a00;--wrb:#fff0d0;--er:#d42a4a;--erb:#ffe2e8;--sh:0 1px 2px rgba(22,26,59,.06),0 6px 18px rgba(22,26,59,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1020;--card:#181b36;--tx:#eef0ff;--mut:#9aa0cc;--bd:#2a2e57;--pri:#5aa2ff;--pri2:#2dd4bf;--ok:#3ddc8b;--okb:#0f3a29;--wr:#ffb33d;--wrb:#3f2c08;--er:#ff7a90;--erb:#471726;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Plus Jakarta Sans",system-ui,Segoe UI,Roboto,sans-serif}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 20px;background:linear-gradient(115deg,#0b1b4d,#1f6fe5 58%,#14b8a6);color:#fff;box-shadow:0 4px 18px rgba(15,60,160,.35);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}.hlogo{display:block;height:62px;width:auto;background:#fff;border-radius:12px;padding:2px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}.brand span{font-weight:500;opacity:.85}
.logo{display:block;width:100%;max-width:400px;margin:0 auto 14px;border-radius:12px;background:#fff}
h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
header .mut{color:#dcd6ff}
header button.s{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{display:flex;align-items:center;gap:7px;background:transparent;color:#e4dfff;border:0;padding:9px 15px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;transition:background .15s}
nav button:hover{background:rgba(255,255,255,.14)}
nav button.on{background:#fff;color:#1553b8}
nav button[data-t=issue]::before{content:"📤"}nav button[data-t=ret]::before{content:"📥"}nav button[data-t=live]::before{content:"📊"}nav button[data-t=log]::before{content:"🧾"}nav button[data-t=set]::before{content:"⚙️"}
main{max-width:1040px;margin:0 auto;padding:18px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
#t-issue>.card{border-top:5px solid var(--pri)}#t-ret>.card{border-top:5px solid var(--ok)}
h3{margin:0 0 10px;font-size:16px;font-weight:800}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:11px;background:var(--bg);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace}
button.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 40%,transparent)}
button.p:active{transform:translateY(1px)}
button.s{background:var(--card);border:1.5px solid var(--bd);border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:600}
button.s:hover{border-color:var(--pri)}
.sm{padding:5px 10px;font-size:13px}select.sm{width:auto}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.big input{font-size:22px;padding:18px;text-align:center;font-weight:700;border-width:2px;border-color:var(--pri)}
.fb{border-radius:14px;padding:18px;text-align:center;font-size:21px;font-weight:800;margin:12px 0;animation:pop .22s ease-out}
.fb.ok{background:linear-gradient(135deg,#0b9150,#14b866);color:#fff}
.fb.er{background:linear-gradient(135deg,#d42a4a,#f0506e);color:#fff}
.fb small{display:block;font-weight:500;font-size:14px;opacity:.92;margin-top:3px}
#pcard.fb{background:linear-gradient(135deg,var(--pri),var(--pri2));animation:none}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.grid div{background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--pri);border-radius:14px;padding:12px;text-align:center;color:var(--mut);font-weight:600;box-shadow:var(--sh)}
.grid b{display:block;font-size:30px;font-weight:800;color:var(--pri)}
.grid div:nth-child(2){border-top-color:var(--ok)}.grid div:nth-child(2) b{color:var(--ok)}
.grid div:nth-child(3){border-top-color:#f59e0b}.grid div:nth-child(3) b{color:var(--wr)}
.grid div:nth-child(4){border-top-color:var(--er)}.grid div:nth-child(4) b{color:var(--er)}
.grid div:nth-child(5){border-top-color:#64748b}.grid div:nth-child(5) b{color:#64748b}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:14px}
th{color:var(--mut);font-size:13px;font-weight:700;background:color-mix(in srgb,var(--pri) 7%,transparent)}
tr:hover td{background:color-mix(in srgb,var(--pri) 5%,transparent)}
.tw{overflow-x:auto}.mut{color:var(--mut)}.hide{display:none!important}
.late{color:var(--er);font-weight:800}
.tg{display:inline-flex;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.tg button{border:0;background:var(--bg);padding:11px 18px;cursor:pointer;font-weight:700}
.tg button.on{background:var(--pri);color:#fff}
#cond button.on{background:var(--ok)}#cond button.on.dm{background:var(--er)}
body:has(#login:not(.hide)),body:has(#setup:not(.hide)){background:linear-gradient(135deg,#0b1b4d,#1f6fe5 55%,#14b8a6);min-height:100vh}
#login .card,#setup .card{border-radius:20px;box-shadow:0 20px 50px rgba(5,20,70,.45);border-top:0}
#login h1{color:var(--tx);font-size:22px}
@media(max-width:720px){
 header{padding:8px 12px}.hlogo{height:42px}
 nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:0;z-index:30;box-shadow:0 -6px 20px rgba(22,26,59,.12)}
 nav button{flex-direction:column;gap:2px;font-size:12px;padding:6px 10px;color:var(--mut);border-radius:12px;flex:1}
 nav button.on{background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri)}
 nav button:hover{background:transparent}
 body{padding-bottom:84px}
}

<script src="config.js"></script>
<script>
const CFG=Object.assign({url:"",key:""},window.SCANTRACK||{});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ft=t=>t?new Date(t).toLocaleString([], {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";
let S={tok:null,ref:null,email:""},devs=[],zones=[],person=null,cond="OK",logRows=[],cnt={i:0,r:0};
try{const c=JSON.parse(localStorage.getItem("sb_cfg")||"{}");if(!CFG.url)Object.assign(CFG,c);const s=JSON.parse(localStorage.getItem("sb_sess")||"null");if(s)S=s}catch(e){}
function beep(ok){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=ok?880:220;o.connect(a.destination);o.start();o.stop(a.currentTime+(ok?.1:.35))}catch(e){}if(navigator.vibrate)navigator.vibrate(ok?60:[120,60,120])}
function view(v){["login","setup","app"].forEach(x=>$(x).classList.toggle("hide",x!==v))}
function saveCfg(){CFG.url=$("cu").value.trim().replace(/\/$/,"");CFG.key=$("ck").value.trim();try{localStorage.setItem("sb_cfg",JSON.stringify(CFG))}catch(e){}boot()}
function persist(){try{localStorage.setItem("sb_sess",JSON.stringify(S))}catch(e){}}
async function login(){
 const r=await fetch(CFG.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});
 const j=await r.json();if(!r.ok){$("lerr").textContent=j.error_description||j.msg||"Login failed";return}
 S={tok:j.access_token,ref:j.refresh_token,email:j.user.email};persist();boot()}
function logout(){S={tok:null};persist();boot()}
async function refresh(){if(!S.ref)return false;const r=await fetch(CFG.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.ref})});if(!r.ok)return false;const j=await r.json();S.tok=j.access_token;S.ref=j.refresh_token;persist();return true}
async function api(path,o={},retry=true){
 const r=await fetch(CFG.url+"/rest/v1/"+path,{method:o.method||"GET",headers:{apikey:CFG.key,Authorization:"Bearer "+S.tok,"Content-Type":"application/json",...(o.h||{})},body:o.body?JSON.stringify(o.body):undefined});
 if(r.status===401&&retry&&await refresh())return api(path,o,false);
 if(r.status===401){logout();throw new Error("Session expired")}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.hint))||"Request failed");return j}
async function boot(){
 if(!CFG.url||!CFG.key)return view("setup");
 if(!S.tok)return view("login");
 view("app");$("usr").textContent=S.email;
 try{await loadAdminFlag();await refreshAll();$("pin").focus()}catch(e){}
}
async function refreshAll(){

 $("stats").innerHTML=[["Total",devs.length],["In store",n("store")],["Issued",n("issued")],["Damaged",n("damaged")],["Lost",n("lost")]].map(([a,b])=>`<div><b>${b}</b>${a}</div>`).join("");

 $("lt").innerHTML="<table><tr><th>Device</th><th>Holder</th><th>Zone</th><th>Shift</th><th>Out since</th></tr>"+rows.map(d=>{const h=(now-new Date(d.issued_at))/36e5;return `<tr><td>${esc(d.code)}</td><td>${esc(d.holder_name)} <span class=mut>${esc(d.holder_code)}</span></td><td>${esc(d.zone)}</td><td>${esc(d.shift)}</td><td class="${h>12?"late":""}">${ft(d.issued_at)} (${h.toFixed(1)}h)</td></tr>`}).join("")+"</table>"}

let archInfo=null,ISADMIN=false,ISMGR=false,adm="dev",ppl=[],admins=[],mgrs=[];
const J=v=>esc(JSON.stringify(v)),SL={store:"In stock",damaged:"Damaged",lost:"Lost",issued:"Issued"},msg=t=>$("sm").textContent=t;

function zopt(z){return `<option value="">No zone</option>`+zones.map(x=>`<option ${x===z?"selected":""}>${esc(x)}</option>`).join("")}
function drawAdm(){const el=$("abody"),q=($("aq").value||"").toLowerCase();let h="";
 if(adm==="dev"){const rows=devs.filter(d=>!q||[d.code,d.model,d.status,d.holder_name].join(" ").toLowerCase().includes(q)).slice(0,300);
  h=`<div class="row" style="margin:0 0 10px"><input id="nc" placeholder="Device code"><input id="nm" placeholder="Model"><button class="p" onclick="addDev()" style="flex:0 0 90px">Add</button></div><p class="mut">Showing ${rows.length} of ${devs.length}. Use the status menu to move a device to In stock, Damaged or Lost (also force-returns an issued device).</p><div class="tw"><table><tr><th>Code</th><th>Model</th><th>Status</th><th>Holder</th><th></th></tr>`+rows.map(d=>`<tr><td>${esc(d.code)}</td><td>${esc(d.model)}</td><td><select class="sm" onchange="setStat(${J(d.code)},this.value)"><option value="">${SL[d.status]} ▾</option>${["store","damaged","lost"].filter(x=>x!==d.status).map(x=>`<option value="${x}">→ ${SL[x]}</option>`).join("")}</select></td><td>${esc(d.holder_name)}</td><td><button class="s sm" onclick="editDev(${J(d.code)})">Edit</button> ${ISADMIN?`<button class="s sm" onclick="delDev(${J(d.code)})">Delete</button>`:""}</td></tr>`).join("")+"</table></div>"}
 else if(adm==="ppl"){const rows=ppl.filter(p=>!q||[p.code,p.name,p.zone,p.role].join(" ").toLowerCase().includes(q)).slice(0,300);
  h=`<div class="row" style="margin:0 0 10px"><input id="pc" placeholder="Code"><input id="pn" placeholder="Name"><select id="pr"><option>supervisor</option><option>worker</option><option>manager</option></select><select id="pz">${zopt("")}</select><button class="p" onclick="addPpl()" style="flex:0 0 90px">Add</button></div><p class="mut">Showing ${rows.length} of ${ppl.length}</p><div class="tw"><table><tr><th>Code</th><th>Name</th><th>Role</th><th>Zone</th><th></th></tr>`+rows.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.role)}</td><td>${esc(p.zone)}</td><td><button class="s sm" onclick="editPpl(${J(p.code)})">Edit</button> ${ISADMIN?`<button class="s sm" onclick="delPpl(${J(p.code)})">Delete</button>`:""}</td></tr>`).join("")+"</table></div>"}
 else if(adm==="zone"){h=`<div class="row" style="margin:0 0 10px"><input id="zn" placeholder="New zone name"><button class="p" onclick="addZone()" style="flex:0 0 90px">Add</button></div>`+(zones.map(z=>`<div class="row" style="align-items:center;margin:0"><span>${esc(z)}</span><span style="flex:0 0 80px">${ISADMIN?`<button class="s sm" onclick="delZone(${J(z)})">Delete</button>`:""}</span></div>`).join("")||"<p class=mut>No zones yet</p>")}
 else if(adm==="adm"){const lst=(a,fn)=>a.map(e=>`<div class="row" style="align-items:center;margin:0"><span>${esc(e)}</span><span style="flex:0 0 80px"><button class="s sm" onclick="${fn}(${J(e)})">Remove</button></span></div>`).join("")||"<p class=mut>None</p>";
  h=`<p class="mut">Admin = full control incl. delete. Manager = add and edit devices, people, zones and change status, but no delete. Store keepers are created in Supabase → Authentication → Users (use an existing user's email here).</p><h3>Admins</h3><div class="row" style="margin:0 0 10px"><input id="ae" type="email" placeholder="Email"><button class="p" onclick="addAdmin()" style="flex:0 0 90px">Add</button></div>${lst(admins,"rmAdmin")}<h3 style="margin-top:14px">Managers</h3><div class="row" style="margin:0 0 10px"><input id="me" type="email" placeholder="Email"><button class="p" onclick="addMgr()" style="flex:0 0 90px">Add</button></div>${lst(mgrs,"rmMgr")}`}
 else if(adm==="arch"){const i=archInfo&&archInfo.ok?archInfo:null,mb=b=>(b/1048576).toFixed(1)+" MB",pct=i?Math.min(100,i.db_bytes/524288000*100):0;
  h=`<p class="mut">Keep the free database small: download old log rows as a CSV file, check it, then remove them from the database. Devices, people and zones are never touched.</p>`+(i?`<div class="grid"><div><b>${mb(i.db_bytes)}</b>Database (free limit 500 MB)</div><div><b>${i.rows}</b>Log rows (${mb(i.log_bytes)})</div><div><b>${i.oldest?ft(i.oldest):"-"}</b>Oldest entry</div></div><div style="height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px"><div style="width:${pct.toFixed(1)}%;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))"></div></div>`:`<p class="mut">Run archive.sql in Supabase to turn this on.</p>`)+`<p><b>Keep the last (days):</b></p><div class="row" style="margin-top:0"><input id="ad" type="number" min="7" value="90" style="max-width:120px"><button class="p" onclick="doArchive(true)">Download CSV and delete</button><button class="s" onclick="doArchive(false)">Download only</button></div><p class="mut">Minimum 7 days. You are asked to confirm before anything is deleted, after the CSV has downloaded. The size shown may not drop at once, because freed space is reused first.</p>`}
 else{h=`<h3>Bulk add devices</h3><p class="mut">One per line: code,model. Paste from Excel, or load a CSV file.</p><button class="s sm" onclick="tpl('dev')">⬇ Download template</button> <input type="file" accept=".csv,.txt" onchange="loadFile(this,'bd')" style="margin-bottom:8px"><textarea id="bd"></textarea><div class="row"><button class="p" onclick="bulkDev()">Add devices</button></div><h3 style="margin-top:14px">Bulk add people</h3><p class="mut">One per line: code,name,role,zone. Paste from Excel, or load a CSV file.</p><button class="s sm" onclick="tpl('ppl')">⬇ Download template</button> <input type="file" accept=".csv,.txt" onchange="loadFile(this,'bp')" style="margin-bottom:8px"><textarea id="bp"></textarea><div class="row"><button class="p" onclick="bulkPpl()">Add / update people</button></div>`}
 el.innerHTML=h}
async function run(f,ok){try{await f();if(ok)msg(ok)}catch(e){msg(e.message)}await refreshAll();if(adm==="ppl")ppl=await api("people?select=*&order=code",{h:{Range:"0-4999"}}).catch(()=>ppl);drawAdm()}

function setStat(c,st){if(!st)return;const m=prompt("Note / remark (optional):","");if(m===null)return drawAdm();
 run(async()=>{const r=await api("rpc/admin_set_status",{method:"POST",body:{p_code:c,p_status:st,p_remarks:m.trim()||null}});msg(r.ok?c+" → "+SL[st]:r.msg)})}

const addPpl=()=>{const c=$("pc").value.trim();if(c)run(()=>api("people",{method:"POST",body:{code:c,name:$("pn").value.trim()||c,role:$("pr").value,zone:$("pz").value||null}}),"Added "+c)};

function tpl(k){const d=k==="dev",t=d?"code,model\nDEV-0001,Zebra TC21\nDEV-0002,Zebra TC21\n":"code,name,role,zone\nSUP001,Rahul Patel,supervisor,Inbound\nWRK001,Neha Desai,worker,Packing\n";

function csvOut(rows,name){const k=["ts","action","device_code","person_code","person_name","zone","shift","by_user","condition","issue","remarks"];
 const t=[k.join(","),...rows.map(r=>k.map(c=>'"'+String(r[c]??"").replace(/"/g,'""')+'"').join(","))].join("\n");

async function doArchive(del){const days=Math.max(7,parseInt($("ad").value)||90),cut=new Date(Date.now()-days*864e5).toISOString();let rows=[];msg("Fetching old log rows...");
 try{for(;;){const r=await api("txns?select=*&order=ts.asc,id.asc&ts=lt."+enc(cut)+"&limit=1000&offset="+rows.length);rows=rows.concat(r);if(r.length<1000)break;msg("Fetched "+rows.length+" rows...")}}catch(e){return msg(e.message)}
 if(!rows.length)return msg("No log rows older than "+days+" days.");
 csvOut(rows,"sambhal-log-before-"+cut.slice(0,10)+".csv");
 if(!del)return msg("Downloaded "+rows.length+" rows. Nothing was deleted.");
 if(!confirm("Downloaded "+rows.length+" rows. Open the CSV and check it first.\n\nDelete these "+rows.length+" rows from the database now?"))return msg("Downloaded "+rows.length+" rows. Nothing was deleted.");
 try{const r=await api("rpc/purge_logs",{method:"POST",body:{p_before:cut}});msg(r.ok?"Deleted "+r.deleted+" rows. The CSV is saved on this PC.":r.msg)}catch(e){msg(e.message)}

 $("lg").innerHTML="<table><tr><th>Time</th><th>Action</th><th>Device</th><th>Person</th><th>Zone</th><th>Shift</th><th>Room staff</th><th>Issue</th><th>Remarks</th></tr>"+logRows.map(r=>`<tr><td>${ft(r.ts)}</td><td>${({ISSUE:"OUT",RETURN:"IN",REPAIRED:"FIXED"})[r.action]||r.action}</td><td>${esc(r.device_code)}</td><td>${esc(r.person_name)} <span class=mut>${esc(r.person_code)}</span></td><td>${esc(r.zone)}</td><td>${esc(r.shift)}</td><td>${esc(r.by_user)}</td><td>${esc(r.issue)}</td><td>${esc(r.remarks)}</td></tr>`).join("")+"</table>"}

 const t=[h.join(","),...logRows.map(r=>h.map(k=>'"'+String(r[k]??"").replace(/"/g,'""')+'"').join(","))].join("\n");
